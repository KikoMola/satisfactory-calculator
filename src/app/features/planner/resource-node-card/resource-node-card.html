@let n = node();
<header class="flex h-13 items-center gap-1 border-b border-line pr-2 pl-1">
  <button
    type="button"
    ngpButton
    cdkDragHandle
    class="flex h-10 min-w-0 flex-1 cursor-grab items-center gap-2 rounded-md px-2 text-left font-semibold data-hover:bg-hover group-[.cdk-drag-dragging]/card:cursor-grabbing"
    [attr.aria-describedby]="n.id + '-move-help'"
    (keydown)="onHandleKeydown($event)"
  >
    <span class="size-3 shrink-0 rounded-full bg-(--resource-color)" aria-hidden="true"></span>
    <span class="truncate"><span class="sr-only">Nodo de </span>{{ n.resource.name.es }}</span>
  </button>
  <button
    type="button"
    appButton
    variant="icon"
    [attr.aria-label]="'Eliminar nodo de ' + n.resource.name.es"
    (click)="remove()"
  >
    <app-icon-close />
  </button>
  <span [id]="n.id + '-move-help'" class="sr-only">
    Arrastra para mover. Con el foco aquí, usa las flechas (Mayús para pasos grandes).
  </span>
</header>

<div class="grid gap-3 p-3">
  <div ngpFormField class="grid gap-1">
    <span ngpLabel class="text-xs text-muted">Recurso</span>
    <app-select
      class="w-full"
      [options]="store.resourceOptions"
      [value]="n.resourceId"
      (valueChange)="setResource($event)"
    />
  </div>

  <div class="grid grid-cols-2 gap-2">
    <div ngpFormField class="grid min-w-0 gap-1">
      <span ngpLabel class="text-xs text-muted">Pureza</span>
      <app-select
        class="w-full"
        [options]="store.purityOptions"
        [value]="n.purity"
        [showHint]="true"
        (valueChange)="setPurity($event)"
      />
    </div>

    <div ngpFormField class="grid min-w-0 gap-1">
      <span ngpLabel class="text-xs text-muted">Taladro</span>
      <app-select
        class="w-full"
        [options]="store.minerOptions"
        [value]="n.minerId"
        (valueChange)="setMiner($event)"
      />
    </div>
  </div>

  <dl class="m-0 grid grid-cols-2 gap-2">
    <div>
      <dt class="text-xs text-muted">Producción</dt>
      <dd class="m-0 text-lg font-bold tabular-nums">{{ n.rate | number: '1.0-2' }} /min</dd>
    </div>
    <div>
      <dt class="text-xs text-muted">Consumo</dt>
      <dd class="m-0 text-lg font-bold tabular-nums">{{ n.powerMW | number: '1.0-2' }} MW</dd>
    </div>
  </dl>
</div>

<!-- Output port, centred on CANVAS.portOffset = (288, 28) from the card's outer corner. -->
@if (!n.hasBelt) {
  <button
    type="button"
    ngpButton
    cdkDrag
    cdkDragBoundary=".planner-surface"
    class="absolute top-3 -right-[13px] size-6 cursor-crosshair touch-none rounded-full border-3 border-panel bg-accent p-0 transition-[scale] data-hover:scale-115 [&.cdk-drag-dragging]:ring-4 [&.cdk-drag-dragging]:ring-accent/35"
    [attr.aria-label]="'Sacar cinta transportadora del nodo de ' + n.resource.name.es"
    title="Arrastra para sacar una cinta transportadora"
    (pointerdown)="onPortPointerDown()"
    (cdkDragStarted)="onPortDragStarted()"
    (cdkDragMoved)="onPortDragMoved($event)"
    (cdkDragEnded)="onPortDragEnded($event)"
    (click)="onPortClick()"
  ></button>
} @else {
  <span
    class="absolute top-3 -right-[13px] size-6 rounded-full border-3 border-panel bg-muted"
    aria-hidden="true"
  ></span>
}
